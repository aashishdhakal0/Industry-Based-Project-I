{% comment %}Main completions-over-time chart. Expects `c` (a services.AreaChart).
Real data; renders an empty state when there's nothing to plot.{% endcomment %}
{% if c.empty %}
  <div class="cy-chart__empty">No completions yet. This fills in as learners finish lessons and quizzes.</div>
{% else %}
  <svg class="cy-area" viewBox="0 0 {{ c.width }} {{ c.height }}" role="img" aria-label="Completions per week">
    <defs>
      <linearGradient id="cy-area-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--cy-violet)" stop-opacity="0.34"/>
        <stop offset="1" stop-color="var(--cy-violet)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    {% for gy, val in c.gridlines %}
      <line class="cy-area__grid" x1="30" y1="{{ gy }}" x2="{{ c.width }}" y2="{{ gy }}"/>
      <text class="cy-area__ytick" x="24" y="{{ gy }}" text-anchor="end" dominant-baseline="middle">{{ val }}</text>
    {% endfor %}
    <path class="cy-area__fill" d="{{ c.area }}" fill="url(#cy-area-grad)"/>
    <polyline class="cy-area__line" points="{{ c.line }}" vector-effect="non-scaling-stroke"/>
    {% for x, y, val, label in c.points %}
      {% if forloop.last %}<circle class="cy-area__dot" cx="{{ x }}" cy="{{ y }}" r="3.4"/>{% endif %}
    {% endfor %}
    {% for x, label in c.xlabels %}
      <text class="cy-area__xtick" x="{{ x }}" y="{{ c.height|add:'-6' }}" text-anchor="middle">{{ label }}</text>
    {% endfor %}
  </svg>
{% endif %}
