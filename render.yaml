# Render Blueprint for Cybaroo (NSTP).
#
# This Blueprint manages the WEB SERVICE ONLY. It deliberately does NOT declare a
# `databases:` block: Render's free tier allows just one free database per
# account and Cybaroo already has one, so declaring a database here would make
# the sync try to create a second one and fail ("cannot have more than one active
# free tier database"), cancelling every other change in the sync.
#
# Instead, DATABASE_URL is set in the dashboard (sync: false), pointing at the
# EXISTING database's Internal Database URL. SECRET_KEY is generated for you;
# RENDER_EXTERNAL_HOSTNAME is injected automatically (settings.py trusts it for
# ALLOWED_HOSTS and CSRF). Set every `sync: false` variable in the dashboard.

services:
  - type: web
    name: cybaroo
    runtime: python
    plan: free
    # Must be the SAME region as your existing database, or the internal DB
    # hostname will not resolve. Your current deploy already connects, so this
    # matches it; change it only if you move the database.
    region: oregon
    buildCommand: "./build.sh"
    # Migrations run at start-up, not in the build: the build environment cannot
    # resolve the internal database hostname, but the running service can.
    # `start.sh` runs migrate + seed, then execs gunicorn. One worker keeps the
    # in-memory rate-limit cache coherent and fits the free tier's 512 MB.
    startCommand: "./start.sh"
    envVars:
      # Set in the dashboard to your existing database's INTERNAL Database URL
      # (Dashboard > cybaroo-db > Connect > Internal Database URL). Not managed
      # by this Blueprint, so it is never touched by a sync and you can edit it.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: SITE_NAME
        value: "Cybaroo"
      # Resend's shared test sender (no domain DNS needed). Note: it only
      # delivers to the email on your own Resend account, so it's fine for
      # testing your own logins but not for emailing other users.
      - key: DEFAULT_FROM_EMAIL
        value: "onboarding@resend.dev"
      - key: RATELIMIT_ENABLE
        value: "True"
      # --- First administrator (created once, on first deploy) ---
      # start.sh runs `ensure_admin` before seeding. Set ADMIN_EMAIL and
      # ADMIN_PASSWORD in the dashboard; the account is created as an
      # administrator you can sign in with at /admin/. Names are optional.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      # --- Email via Resend's HTTPS API (SMTP is blocked on Render's free tier) ---
      # The backend is set here; add your Resend API key in the dashboard. Emails
      # fail silently (logged, never a 500) if the provider is down.
      - key: EMAIL_BACKEND
        value: "nstp.email.ResendEmailBackend"
      - key: EMAIL_FAIL_SILENTLY
        value: "True"
      - key: RESEND_API_KEY
        sync: false      # paste your Resend API key (re_...) in the dashboard
