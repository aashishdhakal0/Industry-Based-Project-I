# Render Blueprint for Cybaroo (NSTP).
#
# Deploy from the Render dashboard: New > Blueprint, point it at this repo, and
# Render reads this file to create the web service and a free PostgreSQL
# database, wiring them together. SECRET_KEY is generated for you; DATABASE_URL
# is injected from the database; RENDER_EXTERNAL_HOSTNAME is injected
# automatically (settings.py trusts it for ALLOWED_HOSTS and CSRF).
#
# Fill the EMAIL_* variables in the dashboard to send real 2FA / verification
# emails. Left unset, email falls back to the console backend and codes are
# printed to the service logs instead of being delivered.

databases:
  - name: cybaroo-db
    plan: free
    # region MUST match the web service's region below. The database's internal
    # hostname (dpg-xxxxx-a) only resolves from services in the SAME region.
    region: oregon
    databaseName: nstp_db
    user: nstp

services:
  - type: web
    name: cybaroo
    runtime: python
    plan: free
    # Same region as the database above (see the note there).
    region: oregon
    buildCommand: "./build.sh"
    # Migrations run at start-up, not in the build: the build environment cannot
    # resolve the internal database hostname, but the running service can.
    # `start.sh` runs migrate + seed, then execs gunicorn. One worker keeps the
    # in-memory rate-limit cache coherent and fits the free tier's 512 MB.
    startCommand: "./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybaroo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: SITE_NAME
        value: "Cybaroo"
      # Resend's shared test sender (no domain DNS needed). Note: it only
      # delivers to the email on your own Resend account, so it's fine for
      # testing your own logins but not for emailing other users.
      - key: DEFAULT_FROM_EMAIL
        value: "onboarding@resend.dev"
      - key: RATELIMIT_ENABLE
        value: "True"
      # --- First administrator (created once, on first deploy) ---
      # start.sh runs `ensure_admin` before seeding. Set ADMIN_EMAIL and
      # ADMIN_PASSWORD in the dashboard; the account is created as an
      # administrator you can sign in with at /admin/. Names are optional.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      # --- Email via Resend's HTTPS API (SMTP is blocked on Render's free tier) ---
      # The backend is set here; add your Resend API key in the dashboard. Emails
      # fail silently (logged, never a 500) if the provider is down.
      - key: EMAIL_BACKEND
        value: "nstp.email.ResendEmailBackend"
      - key: EMAIL_FAIL_SILENTLY
        value: "True"
      - key: RESEND_API_KEY
        sync: false      # paste your Resend API key (re_...) in the dashboard
