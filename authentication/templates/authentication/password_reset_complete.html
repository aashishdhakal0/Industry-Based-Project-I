{% extends "authentication/_auth_base.html" %}

{% block title %}Password updated — {{ site_name }}{% endblock %}

{% block auth_content %}
<div class="cy-card cy-card--narrow">
  <div class="cy-status-icon cy-status-icon--good" aria-hidden="true">
    <svg class="cy-i"><use href="#i-check-circle"/></svg>
  </div>

  <h1>Password updated</h1>
  <p class="cy-lede">
    Your new password is saved. Log in with it to get back to your lessons.
  </p>

  <a class="cy-btn cy-btn--primary cy-btn--block"
     href="{% url 'authentication:login' %}">Log in</a>
</div>
{% endblock %}
