[pytest]
DJANGO_SETTINGS_MODULE = nstp.settings
python_files = test_*.py
addopts = --strict-markers -q

# Rate limiting is disabled per-test by an autouse fixture in conftest.py, not
# here: a bare `env =` key needs the pytest-env plugin, which we don't have,
# and fails silently without it. The fixture also clears django-ratelimit's
# cache between tests, which a settings flag alone would not do.
