[pytest]
DJANGO_SETTINGS_MODULE = nstp.settings
python_files = test_*.py
addopts = --strict-markers -q

# NOTE for task 1.5 (rate limiting): rate limits are per-IP and every test
# client shares one, so a long run would start collecting 429s instead of the
# thing it asserts. Disable it via an autouse fixture in conftest.py when the
# @ratelimit decorators land — a bare `env =` key here needs the pytest-env
# plugin, which we do not have, and fails silently without it.
